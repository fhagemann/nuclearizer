name: Nuclearizer Tests for develop/em
on:
  push:
    branches:
      - develop/em
    tags: '*'
  pull_request:
    branches:
      - develop/em
  release:

jobs:
  # ── Prepare job ─────────────────────────────────────────────────────────────
  #
  # Detects which Nuclearizer source files changed in this push/PR so that the
  # build job can perform a surgical partial rebuild instead of recompiling
  # everything.  Runs once and passes results to all downstream jobs via outputs.
  #
  prepare:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any-changed: ${{ steps.changed.outputs.any }}
      changed-files: ${{ steps.changed.outputs.files }}
    steps:
      - name: Checkout Nuclearizer
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git diff

      - name: Detect changed source files
        id: changed
        run: |
          set -euo pipefail

          # github.event.before is only populated on push events;
          # fall back to the PR base SHA for pull_request events.
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ]; then
            BEFORE="${{ github.event.pull_request.base.sha }}"
          fi

          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Could not determine base commit — assuming all files changed"
            echo "any=unknown" >> "$GITHUB_OUTPUT"
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing ${BEFORE} to ${{ github.sha }}"
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" \
            -- src include apps Makefile 2>/dev/null || true)

          if [ -z "$CHANGED" ]; then
            echo "No source files changed"
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "files=" >> "$GITHUB_OUTPUT"
          else
            echo "Changed files:"
            echo "$CHANGED"
            echo "any=true" >> "$GITHUB_OUTPUT"
            # Newlines are not allowed in job outputs; use space as delimiter.
            echo "files=$(echo "$CHANGED" | tr '\n' ' ' | sed 's/ $//')" >> "$GITHUB_OUTPUT"
          fi

  # ── Build job ────────────────────────────────────────────────────────────────
  build:
    name: Ubuntu
    needs: prepare
    runs-on: ubuntu-latest
    env:
      MEGALIB: ${{ github.workspace }}/megalib
      NUCLEARIZER: ${{ github.workspace }}

      # ccache settings
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: true
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: true
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      NUCLEARIZER_CACHE_DIR: ${{ github.workspace }}/.nuclearizer-cache

    steps:
      - name: Setup Conda Environment
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: cosi-env
          channels: conda-forge
          create-args: >-
            root=6.32 geant4=11.2 healpix_cxx
            pkg-config make cmake cxx-compiler ccache
            ccfits=2.6 cfitsio=4.3 hdf5=1.14
          cache-environment: true

      - name: Write pkg-config files & sanity-check
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail

          echo -e "prefix=$CONDA_PREFIX\nexec_prefix=\${prefix}\nlibdir=\${exec_prefix}/lib\nincludedir=\${prefix}/include\n\nName: hdf5\nDescription: HDF5\nVersion: 1.14\nLibs: -L\${libdir} -lhdf5 -lhdf5_cpp\nCflags: -I\${includedir}" > "$CONDA_PREFIX/lib/pkgconfig/hdf5.pc"
          echo -e "prefix=$CONDA_PREFIX\nexec_prefix=\${prefix}\nlibdir=\${exec_prefix}/lib\nincludedir=\${prefix}/include\n\nName: CCfits\nDescription: CCfits\nVersion: 2.6\nLibs: -L\${libdir} -lCCfits\nCflags: -I\${includedir}" > "$CONDA_PREFIX/lib/pkgconfig/CCfits.pc"

          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig:$CONDA_PREFIX/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          pkg-config --print-errors --exists hdf5
          pkg-config --print-errors --exists CCfits

      - name: Checkout Nuclearizer
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout MEGAlib
        uses: actions/checkout@v4
        with:
          repository: zoglauer/megalib
          ref: develop-cosi
          path: megalib

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          key: ${{ runner.os }}-ccache-v1
          restore-keys: ${{ runner.os }}-ccache-
          max-size: 2G

      # ── MEGAlib cache (stable, ~200 MB) ─────────────────────────────────────
      - name: Cache MEGAlib build
        id: cache-megalib
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/megalib/lib
            ${{ github.workspace }}/megalib/bin
            ${{ github.workspace }}/megalib/include
            ${{ github.workspace }}/megalib/config
          key: megalib-${{ runner.os }}-${{ hashFiles('megalib/src/**', 'megalib/configure') }}
          restore-keys: megalib-${{ runner.os }}-

      - name: Build MEGAlib
        if: steps.cache-megalib.outputs.cache-hit != 'true'
        shell: micromamba-shell {0}
        run: |
          cd "$MEGALIB"
          ./configure
          make -j"$(nproc)"

      # ── Nuclearizer overlay cache (changes often, ~few MB) ───────────────────
      #
      # All Nuclearizer outputs land inside $MEGALIB/lib and $MEGALIB/bin, which
      # are already covered by the MEGAlib cache above.  We stage only the
      # Nuclearizer-specific files into .nuclearizer-cache/ under a separate key.
      #
      # Three scenarios handled here:
      #   Exact hit   – sources unchanged: restore + touch, make does nothing
      #   Partial hit – some sources changed: restore + touch all artifacts,
      #                 then use .d dependency files to find and delete only the
      #                 .o/.d pairs that depend on changed files, make rebuilds
      #                 only those
      #   Cold cache  – first run: skip restore, full build, save cache
      #
      - name: Restore Nuclearizer cache
        id: cache-nuclearizer
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.nuclearizer-cache
          key: nuclearizer-${{ runner.os }}-${{ hashFiles('src/**', 'include/**', 'apps/**', 'Makefile') }}
          restore-keys: nuclearizer-${{ runner.os }}-

      - name: Restore Nuclearizer outputs into MEGAlib tree
        if: steps.cache-nuclearizer.outputs.cache-matched-key != ''
        run: |
          set -euo pipefail
          cp -a "$NUCLEARIZER_CACHE_DIR/lib/." "$MEGALIB/lib/"
          cp -a "$NUCLEARIZER_CACHE_DIR/bin/." "$MEGALIB/bin/"

          # Touch every restored artifact to give it a timestamp that is newer
          # than the freshly checked-out source files.  Without this, make sees
          # the sources as newer than the cached .o/.d files and recompiles
          # everything even when nothing has changed.
          while IFS= read -r -d '' f; do
            touch "$MEGALIB/lib/$(basename "$f")" 2>/dev/null || true
          done < <(find "$NUCLEARIZER_CACHE_DIR/lib" -maxdepth 1 -type f -print0)
          touch "$MEGALIB/bin/nuclearizer" 2>/dev/null || true

          # ── Partial-hit invalidation ────────────────────────────────────────
          #
          # An exact hit means the cache key matched the current source hash, so
          # all artifacts are already correct — nothing to do.
          #
          # A partial hit means we found a cache from a previous build but the
          # sources have changed since then.  We use the .d (dependency) files
          # produced by the compiler to discover which .o files depend on each
          # changed source or header, then delete only those .o/.d pairs.  This
          # correctly handles header fan-out: a single changed .h can invalidate
          # many .o files.
          #
          if [ "${{ steps.cache-nuclearizer.outputs.cache-hit }}" = "true" ]; then
            echo "Exact cache hit — all artifacts are valid"
          else
            echo "Partial cache hit — invalidating artifacts for changed files"

            ANY_CHANGED="${{ needs.prepare.outputs.any-changed }}"
            CHANGED_FILES="${{ needs.prepare.outputs.changed-files }}"

            if [ "$ANY_CHANGED" = "unknown" ] || [ -z "$ANY_CHANGED" ]; then
              # Could not determine base commit; rebuild everything to be safe.
              echo "Base commit unknown — removing all cached artifacts"
              rm -f "$MEGALIB/lib"/*.o "$MEGALIB/lib"/*.d
              rm -f "$MEGALIB/lib"/libNuclearizer.*
              rm -f "$MEGALIB/bin/nuclearizer"
            elif [ "$ANY_CHANGED" = "false" ] || [ -z "$CHANGED_FILES" ]; then
              echo "No source files changed — all artifacts are valid"
            else
              echo "Changed files: $CHANGED_FILES"

              # Collect all .d files once to avoid a separate find per changed
              # file.  For each changed source or header, grep through the list
              # to find every object file that depends on it and delete both the
              # .d and .o so make is forced to recompile exactly those units.
              mapfile -t D_FILES < <(find "$MEGALIB/lib" -maxdepth 1 -name "*.d" -print)
              for changed_file in $CHANGED_FILES; do
                changed_basename=$(basename "$changed_file")
                for d_file in "${D_FILES[@]+"${D_FILES[@]}"}"; do
                  if grep -qF "$changed_basename" "$d_file" 2>/dev/null; then
                    o_file="${d_file%.d}.o"
                    echo "  Invalidating: $(basename "$o_file") (depends on $changed_basename)"
                    rm -f "$d_file" "$o_file"
                  fi
                done
              done

              # Force relink of the shared library and binary so that any
              # updated symbols are picked up even if nothing else changed.
              rm -f "$MEGALIB/lib"/libNuclearizer.*
              rm -f "$MEGALIB/bin/nuclearizer"
            fi
          fi

      - name: Configure build environment
        shell: micromamba-shell {0}
        run: |
          mkdir -p "$CONDA_PREFIX/lib/pkgconfig"
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig:$CONDA_PREFIX/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LD_LIBRARY_PATH="$MEGALIB/lib:$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}"
          export CXX="ccache g++"
          export CC="ccache gcc"

          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib ${LDFLAGS:-}" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
          echo "CC=$CC" >> "$GITHUB_ENV"

          ccache --zero-stats || true

      - name: Build Nuclearizer
        shell: micromamba-shell {0}
        run: |
          # Sentinel created inside the same shell as make, guaranteed same env.
          touch "${{ github.workspace }}/.build-start"
          cd "${{ github.workspace }}"
          make -j"$(nproc)"
          ccache -s || true

      - name: Stage Nuclearizer outputs for caching
        run: |
          set -euo pipefail
          CACHE="${{ github.workspace }}/.nuclearizer-cache"
          LB="${{ github.workspace }}/megalib/lib"
          BN="${{ github.workspace }}/megalib/bin"
          SENTINEL="${{ github.workspace }}/.build-start"
          mkdir -p "$CACHE/lib" "$CACHE/bin"

          # Copy .o/.d files produced in this build run on top of whatever the
          # cache already contains from a previous partial or exact hit.  Using
          # -newer ensures we only pick up files that make actually (re)built,
          # leaving unchanged artifacts from the restored cache untouched.
          find "$LB" -maxdepth 1 \( -name '*.o' -o -name '*.d' \) \
            -newer "$SENTINEL" \
            -exec cp -a {} "$CACHE/lib/" \;
          find "$LB" -maxdepth 1 \( \
            -name 'libNuclearizer.*' -o -name 'Nuclearizer_Dictionary*' \
          \) -exec cp -a {} "$CACHE/lib/" \;
          [ -f "$BN/nuclearizer" ] && cp -a "$BN/nuclearizer" "$CACHE/bin/"

          echo "Staged $(find "$CACHE" -type f | wc -l) files into nuclearizer cache:"
          find "$CACHE" -type f | sort

      # Save only when the key is new — an exact hit means the cache already
      # contains the current build and re-saving would be redundant.
      - name: Save Nuclearizer cache
        if: steps.cache-nuclearizer.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.nuclearizer-cache
          key: nuclearizer-${{ runner.os }}-${{ hashFiles('src/**', 'include/**', 'apps/**', 'Makefile') }}

      - name: Test Nuclearizer
        shell: micromamba-shell {0}
        run: |
          cd "$NUCLEARIZER"
          make test -j"$(nproc)"

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: ${{ github.workspace }}/*.log
